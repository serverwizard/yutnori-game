<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4d6" />
    <title>우리 반 윷놀이</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="conn-banner" class="conn-banner hidden">연결이 끊어졌어요. 다시 연결하는 중… 🔄</div>
    <main id="app" class="app"></main>

    <div id="toss-overlay" class="toss-overlay hidden" aria-live="polite">
      <div class="toss-card">
        <div class="toss-team"></div>
        <div class="sticks">
          <div class="stick"><span class="stick-face"></span></div>
          <div class="stick"><span class="stick-face"></span></div>
          <div class="stick"><span class="stick-face"></span></div>
          <div class="stick"><span class="stick-face"></span></div>
        </div>
        <div class="toss-result"></div>
        <div class="toss-sub"></div>
        <div class="toss-hint">화면을 누르면 넘어가요</div>
      </div>
    </div>

    <div id="callout" class="callout hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <noscript>이 게임은 자바스크립트가 필요해요.</noscript>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
